name: Offline ecosystem real-world integration
# One-off trigger: file changes, plus optional workflow dispatch when available.
# Download only official pinned Mojang inputs into ephemeral .local/.
# No Minecraft game resources are uploaded as artifacts.
on:
  push:
    paths:
      - '.github/workflows/offline-ecosystem-real-world.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-realworld-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      HORIZON_TELEMETRY_URL: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify locked Rust dependencies
        run: cargo metadata --locked --format-version 1 --no-deps >/dev/null
      - name: Restore Horizon-pinned 26.3 metadata
        run: |
          set -euo pipefail
          mkdir -p .local/minecraft/26.3
          curl -fL --retry 3 --retry-delay 2             https://piston-meta.mojang.com/v1/packages/11f1aefe473eefba0af62e3286c33b692807b2eb/26.3.json             -o .local/minecraft/26.3/manifest.json
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          metadata=Path('.local/minecraft/26.3/manifest.json').read_bytes()
          actual=hashlib.sha1(metadata).hexdigest()
          expected='11f1aefe473eefba0af62e3286c33b692807b2eb'
          assert actual == expected, f'pinned manifest unexpectedly changed: {actual}'
          PY
      - name: Prepare private Minecraft resources from official pinned downloads
        run: python3 tools/android_prepare.py --java-home "$JAVA_HOME"
      - name: Assert server-authoritative movement and real block action
        run: cargo test -p horizon-client --locked --no-default-features --test lan_bot offline_ecosystem_player_joins_real_horizon_hub_through_memory -- --nocapture
      - name: Run headless integrated world with two opt-in offline bots
        env:
          HORIZON_ECOSYSTEM_EXPERIMENTAL_BOTS: '2'
        run: |
          set -euo pipefail
          mkdir -p .local/ecosystem-headless
          timeout 240s cargo run --locked --no-default-features -p horizon-client --bin horizon-client -- \
            --resources "$PWD/.local/horizon-client/26.3" \
            --headless --world EcoWorld --seed 42 \
            --world-frames 160 --timeout-seconds 160 \
            --render-distance 2 --name EcoHost --no-pause \
            --game-dir "$PWD/.local/ecosystem-headless" \
            --home "$PWD/.local/ecosystem-headless" \
            --smoke-report "$PWD/.local/ecosystem-headless/report.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.local/ecosystem-headless')
          report=json.loads((root/'report.json').read_text())
          print('Headless world smoke:',report)
          assert report.get('error') is None, report
          assert report.get('player') is not None, 'No real integrated-server player spawned'
          assert report.get('chunks',0)>0, 'No real world chunks loaded'
          logs='\n'.join(p.read_text(errors='replace') for p in root.rglob('*.log'))
          assert 'Offline ecosystem: started 2 opt-in local bots' in logs, (
              'Offline ecosystem worker initialization not observed in game log')
          print('Offline ecosystem headless server initialization verified')
          PY
      - name: Check resource boundary
        if: always()
        run: |
          git diff --exit-code -- . ':!Cargo.lock'
          python3 tools/check_public_tree.py
